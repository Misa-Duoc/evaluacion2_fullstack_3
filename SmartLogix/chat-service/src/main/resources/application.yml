server:
  port: 8085

spring:
  application:
    name: chat-service

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET:SmartLogixSuperSecretKeyForJWT2024PlatformMicroservicesArchitecture!!}

# Configuracion del proveedor de IA (Groq - API gratuita, formato OpenAI-compatible).
# GROQ_API_KEY se debe entregar como variable de entorno; nunca hardcodear la key.
# Se obtiene gratis en https://console.groq.com/keys
groq:
  api-key: ${GROQ_API_KEY:}
  model: ${GROQ_MODEL:llama-3.3-70b-versatile}
  base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
  max-tokens: ${GROQ_MAX_TOKENS:512}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
