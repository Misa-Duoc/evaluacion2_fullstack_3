server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La app usa hash routing (#/shipment, #/inventory, etc.), por lo que
    # cualquier ruta debe resolver siempre a index.html; el enrutamiento
    # real ocurre en el cliente a partir del fragmento de la URL.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
